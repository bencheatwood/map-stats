allowBuilds:
  esbuild: true
  msw: true
  puppeteer: false

blockExoticSubdeps: true
dedupePeers: true

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus*"
  - vite-plus
  - "@oxfmt/*"
  - "@oxlint/*"
  - oxfmt
  - oxlint
  - "@voidzero-dev/*"
  - "@oxlint-tsgolint/*"
  - vitest
  - "@vitest/*"
  - "@oxc-project/*"
  - tsrs
  - "@tsrs/*"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 2880
trustLockfile: true
trustPolicyExclude:
  - pnpm
  - tsrs@7.1.0-beta.tsrs2

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"

update:
  githubActions: true

minimumReleaseAgeExcludePrune: true
